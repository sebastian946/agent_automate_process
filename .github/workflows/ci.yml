name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dzlabs
          POSTGRES_PASSWORD: dzlabs
          POSTGRES_DB: dzlabs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dzlabs" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format check
        run: .venv/bin/ruff format --check .
      - name: Unit tests (sin LLM)
        env:
          DATABASE_URL: postgresql://dzlabs:dzlabs@localhost:5432/dzlabs
          ANTHROPIC_API_KEY: test-key-not-used
          INBOUND_API_TOKEN: test-token
          N8N_WEBHOOK_SECRET: test-secret
          TWILIO_AUTH_TOKEN: test-twilio
        run: .venv/bin/pytest -m "not integration" -q

  evals:
    # Solo corre si el repo tiene el secreto configurado (evita gastar en forks/PRs externos)
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Evals LLM-as-judge (Ventas + Diagnóstico)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INBOUND_API_TOKEN: ci
          N8N_WEBHOOK_SECRET: ci
          TWILIO_AUTH_TOKEN: ci
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "Sin ANTHROPIC_API_KEY: evals omitidos"; exit 0; fi
          .venv/bin/python -m evals.run_evals --min-score 0.8
