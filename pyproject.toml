[project]
name = "dzlabs-sales-engine"
version = "0.1.0"
description = "Motor comercial multi-agente de DZ Labs: Ventas, Perfilador, Diagnóstico y Marketing sobre LangGraph + Claude."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=2.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "langsmith>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dzlabs"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["dzlabs", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "N818"]  # assert en tests es correcto; excepciones en español sin sufijo Error

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108"]
"scripts/*" = ["S"]
"evals/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere ANTHROPIC_API_KEY y/o Postgres (se omite en CI sin secretos)",
]
